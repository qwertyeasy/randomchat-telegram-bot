services:
  app:
    build: .
    container_name: randompersonbot_app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: randompersonbot_postgres
    # временно для тестов
    ports: 5432:5432
    environment:
      POSTGRES_DB: botdb
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: randompersonbot_redis
    restart: unless-stopped

volumes:
  pgdata: